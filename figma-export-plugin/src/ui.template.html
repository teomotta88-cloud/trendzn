<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        margin: 0;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      p {
        margin: 0;
      }
      textarea {
        width: 100%;
        height: 260px;
        box-sizing: border-box;
        font-family: monospace;
        font-size: 11px;
        resize: vertical;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button,
      a.button {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        text-decoration: none;
        color: #111;
        font-size: 12px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <p id="status">Esportazione in corso…</p>
    <textarea id="json" readonly placeholder="Il JSON esportato apparirà qui…"></textarea>
    <div class="row">
      <button id="copy" disabled>Copia JSON</button>
      <a id="download" class="button" download="trendzn-figma-export.json">Scarica .json</a>
    </div>
    <script>
      __SCRIPT__
    </script>
  </body>
</html>
