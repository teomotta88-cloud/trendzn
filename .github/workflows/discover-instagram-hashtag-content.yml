name: Discover Instagram Hashtag Content (gratuito)

# Discovery gratuita di contenuti Instagram via pagina hashtag (nessun
# credit anysite), per i topic attualmente monitorati (monitored_topics,
# popolata da sync-viral-trends.yml). Complementare alla ricerca a
# pagamento via anysite, non la sostituisce — copre solo una parte degli
# hashtag (vedi scripts/discover-instagram-hashtag-content.mjs per il
# tasso di successo atteso e i criteri di esclusione).
#
# timeout-minutes alzato a 180: con MAX_POSTS_PER_HASHTAG=100 (invece di 12)
# ogni hashtag può richiedere fino a un centinaio di pagine singole
# (engagement + data di ciascun contenuto) oltre allo scroll per trovarle —
# il tempo reale dipende da quanti hashtag sono monitorati e da quanti
# contenuti ciascuna pagina hashtag mostra davvero.
#
# 2 job in matrix (shard) invece di 1: un run reale con tutti gli hashtag in
# un'unica sessione Playwright ha mostrato Instagram bloccare (redirect
# login/challenge su ogni pagina-post successiva) dopo circa 500 richieste
# consecutive — sempre gli stessi hashtag in coda finivano bloccati al 100%.
# Dividendo gli hashtag su 2 job separati, ognuno gira su un runner (quindi
# sessione/IP) diverso e resta ben sotto quella soglia — vedi SHARD_COUNT/
# SHARD_INDEX in discover-instagram-hashtag-content.mjs.

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      max_posts_per_hashtag:
        description: "Numero massimo di contenuti (post/carosello/Reel) da ricontrollare per hashtag"
        default: "100"
      recency_window_days:
        description: "Solo contenuti pubblicati non oltre questa finestra (giorni)"
        default: "7"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scopri contenuti Instagram via pagina hashtag
        env:
          MAX_POSTS_PER_HASHTAG: ${{ github.event.inputs.max_posts_per_hashtag || '100' }}
          RECENCY_WINDOW_DAYS: ${{ github.event.inputs.recency_window_days || '7' }}
          SHARD_COUNT: 2
          SHARD_INDEX: ${{ matrix.shard }}
        run: node scripts/discover-instagram-hashtag-content.mjs
