name: Sync Trend Virali

on:
  schedule:
    # Una volta al giorno, qualche ora dopo la sync TikTok Trending IT
    # (00:00/12:00 UTC) cosi' gli hashtag da convertire sono freschi.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      max_hashtags:
        description: "Numero massimo di hashtag TikTok da processare (ognuno cerca su Instagram + TikTok)"
        default: "5"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Nessuna dipendenza da installare: sia la chiamata OpenRouter
      # (scripts/lib/openrouter.mjs) sia il fallback offline
      # (scripts/lib/word-segment.mjs, dizionari JSON bundled nel repo) usano
      # solo fetch nativo, nessun pacchetto npm esterno.

      - name: Sync trend virali
        env:
          ANYSITE_API_KEY: ${{ secrets.ANYSITE_API_KEY }}
          # Opzionale: se assente, la conversione hashtag -> keyword usa solo
          # il fallback offline (meno preciso su nomi propri/toponimi).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_HASHTAGS: ${{ github.event.inputs.max_hashtags || '5' }}
        run: node scripts/sync-viral-trends.mjs
