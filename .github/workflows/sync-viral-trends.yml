name: Sync Trend Virali

on:
  schedule:
    # Ogni 6 ore: aumentato da una volta al giorno (Trend Virali v2) per una
    # finestra di rilevazione più stretta. Coinvolge anysite (a pagamento,
    # ~4x il costo precedente) — cadenza scelta esplicitamente dall'utente,
    # vedi supabase/migrations/20260710120000_monitored_topics.sql.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_hashtags:
        description: "Numero massimo di hashtag TikTok da processare (ognuno cerca su Instagram + TikTok)"
        default: "5"
      max_trends:
        description: "Numero massimo di ricerche Google Trends IT da processare (ognuna cerca solo su Instagram)"
        default: "5"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Nessuna dipendenza da installare: sia la chiamata OpenRouter
      # (scripts/lib/openrouter.mjs) sia i fallback offline
      # (scripts/lib/word-segment.mjs, dizionari JSON bundled nel repo) sia la
      # lettura di Google Trends (scripts/lib/google-trends.mjs, feed RSS
      # pubblico) usano solo fetch nativo, nessun pacchetto npm esterno,
      # nessuna chiave/secret aggiuntiva richiesta per quest'ultima.

      - name: Sync trend virali
        env:
          ANYSITE_API_KEY: ${{ secrets.ANYSITE_API_KEY }}
          # Opzionale: se assente, la conversione hashtag -> keyword usa solo
          # il fallback offline (meno preciso su nomi propri/toponimi).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_HASHTAGS: ${{ github.event.inputs.max_hashtags || '5' }}
          MAX_TRENDS: ${{ github.event.inputs.max_trends || '5' }}
        run: node scripts/sync-viral-trends.mjs
