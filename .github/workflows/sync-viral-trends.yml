name: Sync Trend Virali

on:
  schedule:
    # Ogni ora, al minuto 30: sfalsato dopo tiktok-trending-it.yml (minuto 0)
    # così legge la classifica TikTok appena aggiornata. Da quando anysite è
    # stato rimosso questo run è solo discovery/registrazione topic (nessun
    # costo a pagamento), quindi la cadenza oraria non ha impatto di spesa.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      max_hashtags:
        description: "Numero massimo di hashtag TikTok da monitorare (per rank)"
        default: "100"
      max_trends:
        description: "Numero massimo di ricerche Google Trends IT da monitorare (per data più recente)"
        default: "50"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Nessuna dipendenza da installare: sia la chiamata OpenRouter
      # (scripts/lib/openrouter.mjs) sia i fallback offline
      # (scripts/lib/word-segment.mjs, dizionari JSON bundled nel repo) sia la
      # lettura di Google Trends (scripts/lib/google-trends.mjs, feed RSS
      # pubblico) usano solo fetch nativo, nessun pacchetto npm esterno,
      # nessuna chiave/secret aggiuntiva richiesta per quest'ultima.

      - name: Sync trend virali
        env:
          # Entrambe opzionali: se assenti, la conversione hashtag -> keyword
          # usa solo il fallback offline (meno preciso su nomi propri/
          # toponimi). Groq provato per primo (free tier più ampio).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_HASHTAGS: ${{ github.event.inputs.max_hashtags || '100' }}
          MAX_TRENDS: ${{ github.event.inputs.max_trends || '50' }}
        run: node scripts/sync-viral-trends.mjs
