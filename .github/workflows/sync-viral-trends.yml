name: Sync Trend Virali

on:
  schedule:
    # Ogni 6 ore. Da quando anysite è stato rimosso questo run è solo
    # discovery/registrazione topic (nessun costo a pagamento) — i contenuti
    # arrivano dallo scraping gratuito delle pagine hashtag.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_hashtags:
        description: "Numero massimo di hashtag TikTok da monitorare"
        default: "15"
      max_trends:
        description: "Numero massimo di ricerche Google Trends IT da monitorare"
        default: "15"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Nessuna dipendenza da installare: sia la chiamata OpenRouter
      # (scripts/lib/openrouter.mjs) sia i fallback offline
      # (scripts/lib/word-segment.mjs, dizionari JSON bundled nel repo) sia la
      # lettura di Google Trends (scripts/lib/google-trends.mjs, feed RSS
      # pubblico) usano solo fetch nativo, nessun pacchetto npm esterno,
      # nessuna chiave/secret aggiuntiva richiesta per quest'ultima.

      - name: Sync trend virali
        env:
          # Opzionale: se assente, la conversione hashtag -> keyword usa solo
          # il fallback offline (meno preciso su nomi propri/toponimi).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_HASHTAGS: ${{ github.event.inputs.max_hashtags || '15' }}
          MAX_TRENDS: ${{ github.event.inputs.max_trends || '15' }}
        run: node scripts/sync-viral-trends.mjs
