name: Probe X Account

# Diagnostica manuale: verifica che con l'account X dedicato (secret
# RETTIWT_API_KEY) si riescano a leggere post + engagement di un profilo.
# Lancialo da Actions → "Probe X Account" → Run workflow, poi guarda il log.

on:
  workflow_dispatch:
    inputs:
      screen_name:
        description: "Screen name X da testare (senza @)"
        required: false
        default: "X"
      rettiwt_version:
        description: "Versione di rettiwt-api da testare (vuoto = latest, es. 7.0.3 per una precedente)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # rettiwt-api 7.1.x dichiara "engines": { "node": "^22.21.0" } — con
          # Node 20 (usato dal resto del progetto) le chiamate falliscono con
          # un generico "Unknown error" lato FetcherService, non un errore di
          # auth: verosimilmente un'incompatibilità runtime (fetch/undici),
          # non un problema di account o di schema X.
          node-version: "22"

      - name: Installa rettiwt-api (solo per il probe)
        env:
          RETTIWT_VERSION: ${{ inputs.rettiwt_version }}
        run: |
          if [ -n "$RETTIWT_VERSION" ]; then
            npm install "rettiwt-api@$RETTIWT_VERSION" --no-save
          else
            npm install rettiwt-api --no-save
          fi
          echo "Versione effettivamente installata:"
          npm list rettiwt-api

      - name: Esegui probe
        env:
          RETTIWT_API_KEY: ${{ secrets.RETTIWT_API_KEY }}
          PROBE_SCREEN_NAME: ${{ inputs.screen_name }}
        run: node scripts/probe-x-account.mjs
