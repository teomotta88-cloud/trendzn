name: Scrape Engagement Data via Emplifi

# Recupera views/like/commenti/condivisioni per i post Bluserena BSConfirmed
# della finestra Jul-Ago 2025/2026 via Emplifi Listening. Vedi
# scripts/scrape-engagement-batch.mjs.
#
# Ogni post tentato riceve un record versionato (engagementData): un post già
# tentato non viene rifatto, quindi ogni run costa solo per i post nuovi o
# appena passati a BSConfirmed dall'ultima volta. Lo schedule settimanale
# gira il lunedì all'1 UTC, un'ora dopo "Bulk Verify Bluserena Posts"
# (00:00 UTC), che è il momento in cui i post cambiano status in blocco.
#
# Lo script scrive direttamente su GitHub via API (stesso pattern degli
# altri script Bluserena): niente step "git diff" dopo, il checkout locale
# di questo job non viene mai toccato.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (logga cosa scriverebbe, non commit)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      reprocess_not_found:
        description: "Riprova anche i post non trovati su Emplifi nell'ultima run"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    name: Scrape engagement data for BSConfirmed Jul-Ago posts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Recupera KPI engagement via Emplifi
        env:
          EMPLIFI_API_SECRET: ${{ secrets.EMPLIFI_API_SECRET }}
          EMPLIFI_API_TOKEN: ${{ secrets.EMPLIFI_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REPROCESS_NOT_FOUND: ${{ github.event.inputs.reprocess_not_found || 'false' }}
        run: node scripts/scrape-engagement-batch.mjs
