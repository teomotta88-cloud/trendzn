name: Bluserena Audio Analysis + Speech-to-Text

on:
  schedule:
    # Ogni mercoledì alle 02:00 UTC (giorno diverso dall'OCR)
    - cron: "0 2 * * 3"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Numero massimo di post da elaborare in questa run"
        required: false
        default: "400"
      reprocess_failed:
        description: "Riprova i post la cui trascrizione era fallita (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  # Lo script committa su bluserena-monitoring.json: due run in parallelo si
  # rincorrerebbero a colpi di conflitto sullo stesso file.
  group: bluserena-audio
  cancel-in-progress: false

jobs:
  analyze-audio:
    runs-on: ubuntu-latest
    name: Trascrive l'audio dei video
    # Il limite GitHub è 360 minuti: lo script si ferma da solo prima
    # (MAX_MINUTES) per fare in tempo a committare l'ultimo batch.
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          # La versione apt di yt-dlp è troppo vecchia per TikTok: si usa il
          # binario ufficiale.
          sudo curl -fsSL --retry 3 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version
          ffmpeg -version | head -1

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run audio transcription
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_POSTS: ${{ inputs.max_posts || '400' }}
          REPROCESS_FAILED: ${{ inputs.reprocess_failed || 'false' }}
          MAX_MINUTES: "300"
          BATCH_SIZE: "25"
        run: node scripts/analyze-bluserena-audio.mjs
