name: Backfill Bluserena Location

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run backfill on (default: main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    name: Backfill location from caption matching

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backfill location and engagement data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/backfill-bluserena-location.mjs
