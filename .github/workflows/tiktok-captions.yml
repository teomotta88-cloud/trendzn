name: TikTok captions via oEmbed

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL dei post TikTok, uno per riga"
        required: true
        type: string
      pausa:
        description: "Secondi di attesa tra una richiesta e l'altra (alza a 2-3 se vedi molti 429)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  captions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Gli input passano da env, non interpolati nel comando: cosi' un URL
      # malevolo non puo' iniettare comandi nella shell.
      - name: Recupera caption via oEmbed
        env:
          TIKTOK_URLS: ${{ inputs.urls }}
          TIKTOK_PAUSE: ${{ inputs.pausa }}
        run: python3 .github/scripts/tiktok_captions.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/bluserena-monitoring.json
          git diff --staged --quiet || git commit -m "chore: backfill TikTok captions via oEmbed [trendzn-bot]"
          git push
