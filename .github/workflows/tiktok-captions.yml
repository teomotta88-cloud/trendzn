name: TikTok captions via oEmbed

on:
  workflow_dispatch:
    inputs:
      pausa:
        description: "Secondi di attesa tra una richiesta e l'altra (alza a 2-3 se vedi molti 429)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  captions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Recupera caption via oEmbed
        env:
          TIKTOK_PAUSE: ${{ inputs.pausa }}
        run: python3 .github/scripts/tiktok_captions.py

      # always(): con oltre mille post il run e' lungo, e se viene annullato
      # o va in timeout quanto gia' recuperato viene comunque committato.
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/bluserena-monitoring.json
          git diff --staged --quiet || git commit -m "chore: backfill TikTok captions via oEmbed [trendzn-bot]"
          git push
