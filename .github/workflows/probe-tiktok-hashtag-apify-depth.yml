name: Probe TikTok Hashtag Apify Depth (diagnostico)

# Workflow usa-e-getta: confronta la copertura ottenibile su un hashtag
# TikTok tramite il servizio a pagamento Apify (actor
# clockworks/tiktok-hashtag-scraper) rispetto ai probe fai-da-te già testati
# (scroll DOM: fermo a 60 su #bluserena; paginazione API anonima via
# TikTokApi: bloccata subito da TikTok anche con webkit + ms_token reale).
# Nessuna scrittura su store, solo diagnostica — vedi
# scripts/probe-tiktok-hashtag-apify-depth.mjs. Richiede il secret
# APIFY_API_TOKEN (Settings -> Secrets and variables -> Actions).

on:
  workflow_dispatch:
    inputs:
      hashtag:
        description: "Hashtag TikTok da testare (senza #)"
        required: true
        default: "bluserena"
      results_per_page:
        description: "Numero massimo di risultati richiesti (l'actor dichiara un range tipico di 400-800)"
        required: false
        default: "800"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Interroga Apify e misura la copertura storica
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          RESULTS_PER_PAGE: ${{ github.event.inputs.results_per_page }}
        run: node scripts/probe-tiktok-hashtag-apify-depth.mjs "${{ github.event.inputs.hashtag }}"
