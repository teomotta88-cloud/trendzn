name: Check Secrets Health

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  check-app-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check app-side tokens (GitHub, OpenRouter, Figma, Gmail, Supabase)
        run: |
          set -e
          response=$(curl -sS --max-time 30 -w "\n%{http_code}" "https://trendzn.lovable.app/api/public/hooks/check-token-health")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "$body" | node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
            for (const r of data.results ?? []) {
              const icon = r.valid === true ? "OK" : r.valid === false ? "NON VALIDO" : "N/D";
              const days = r.daysRemaining != null ? ` (scade tra ${r.daysRemaining} giorni)` : "";
              console.log(`[${icon}] ${r.label}${days}: ${r.detail}`);
            }
          '
          if [ "$status" != "200" ]; then
            echo "::error::check-token-health ha riportato almeno un token non valido (HTTP $status)"
            exit 1
          fi

  check-ci-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check CI-only secrets (YouTube, anysite, Twitter, Reddit)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANYSITE_API_KEY: ${{ secrets.ANYSITE_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          RETTIWT_API_KEY: ${{ secrets.RETTIWT_API_KEY }}
          TIKTOK_CC_EMAIL: ${{ secrets.TIKTOK_CC_EMAIL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: node scripts/check-ci-secrets-health.mjs
