name: Sync Brand Mentions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync brand mentions
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANYSITE_API_KEY: ${{ secrets.ANYSITE_API_KEY }}
          PLATFORMS: "youtube,twitter,reddit,instagram,linkedin"
        run: node scripts/sync-brand-mentions.mjs
