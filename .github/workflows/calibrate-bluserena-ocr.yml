name: Bluserena OCR — calibrazione soglia

# Solo manuale: serve a scegliere la soglia di confidenza guardando i numeri
# veri, prima di far girare l'OCR su tutti i post. Non scrive nello store.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Quanti post campionare"
        required: false
        default: "5"
      post_urls:
        description: "URL specifici separati da virgola (vuoto = i primi N)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    name: Misura la confidenza per parola
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          sudo curl -fsSL --retry 3 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Calibrazione
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAMPLE: ${{ inputs.sample || '5' }}
          POST_URLS: ${{ inputs.post_urls || '' }}
        run: node scripts/calibrate-bluserena-ocr.mjs
