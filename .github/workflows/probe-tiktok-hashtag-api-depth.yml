name: Probe TikTok Hashtag API Depth (diagnostico)

# Workflow usa-e-getta: come probe-tiktok-hashtag-depth.yml, ma usa la
# libreria Python TikTokApi (davidteather/TikTok-Api), che pagina l'endpoint
# interno di TikTok con un cursore invece di fare scroll del DOM. Serve a
# capire se il muro visto col probe DOM (60 video su #bluserena, contro un
# conteggio manuale di almeno 360 contenuti reali) è un limite reale
# dell'hashtag o solo della tecnica di scroll anonimo — vedi
# scripts/probe-tiktok-hashtag-api-depth.py.
#
# Primo tentativo (chromium, ms_token auto-generato): bloccato subito da
# TikTok come sessione bot, zero video. La libreria stessa suggerisce
# browser='webkit' o un ms_token reale come prossimi tentativi — entrambi
# selezionabili qui (default webkit; ms_token via secret TIKTOK_MS_TOKEN,
# mai passato in chiaro).

on:
  workflow_dispatch:
    inputs:
      hashtag:
        description: "Hashtag TikTok da testare (senza #)"
        required: true
        default: "bluserena"
      max_videos:
        description: "Numero massimo di video da richiedere in paginazione"
        required: false
        default: "500"
      browser:
        description: "Browser Playwright da usare per la sessione TikTokApi"
        required: false
        default: "webkit"
        type: choice
        options:
          - webkit
          - chromium
          - firefox

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TikTokApi + Playwright
        run: |
          pip install TikTokApi
          python -m playwright install --with-deps ${{ github.event.inputs.browser }}

      - name: Misura la copertura storica via paginazione API
        env:
          MAX_VIDEOS: ${{ github.event.inputs.max_videos }}
          TIKTOK_BROWSER: ${{ github.event.inputs.browser }}
          # Opzionale: se il repo ha un secret TIKTOK_MS_TOKEN configurato
          # (Settings -> Secrets and variables -> Actions), viene usato al
          # posto della generazione automatica, molto meno affidabile con
          # TikTok che rileva sessioni bot senza un token reale (vedi
          # commento in probe-tiktok-hashtag-api-depth.py).
          ms_token: ${{ secrets.TIKTOK_MS_TOKEN }}
        run: python scripts/probe-tiktok-hashtag-api-depth.py "${{ github.event.inputs.hashtag }}"
