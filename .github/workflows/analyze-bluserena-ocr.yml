name: Bluserena OCR + On-Screen Text Analysis

on:
  schedule:
    # Ogni lunedì alle 02:00 UTC (4:00 CEST, orario notturno)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      max_posts:
        description: "Numero massimo di post da elaborare in questa run"
        required: false
        default: "2000"
      reprocess_failed:
        description: "Riprova i post il cui OCR era fallito (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  # Lo script committa su bluserena-monitoring.json: due run in parallelo si
  # rincorrerebbero a colpi di conflitto sullo stesso file.
  group: bluserena-ocr
  cancel-in-progress: false

jobs:
  analyze-ocr:
    runs-on: ubuntu-latest
    name: Estrae il testo on-screen dai video
    # Il limite GitHub è 360 minuti: lo script si ferma da solo prima
    # (MAX_MINUTES) per fare in tempo a committare l'ultimo batch.
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Senza questi due binari lo script esce subito con errore: prima non
      # erano installati affatto e l'OCR falliva in silenzio a ogni post.
      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          # La versione apt di yt-dlp è troppo vecchia per TikTok: si usa il
          # binario ufficiale.
          sudo curl -fsSL --retry 3 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version
          ffmpeg -version | head -1

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run OCR extraction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_POSTS: ${{ inputs.max_posts || '2000' }}
          REPROCESS_FAILED: ${{ inputs.reprocess_failed || 'false' }}
          MAX_MINUTES: "300"
          BATCH_SIZE: "25"
        run: node scripts/analyze-bluserena-ocr.mjs

      - name: Check if more posts need processing and auto-reschedule
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Conta i post non elaborati o con status != 'ok' in ocrData
          REMAINING=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('src/data/bluserena-monitoring.json'));
            let count = 0;
            const dateRanges = [
              { start: new Date('2025-07-01'), end: new Date('2025-08-31') },
              { start: new Date('2026-07-01'), end: new Date('2026-08-31') }
            ];
            const isInRange = (dateStr) => {
              if (!dateStr) return false;
              const d = new Date(dateStr);
              return isNaN(d.getTime()) ? false : dateRanges.some(r => d >= r.start && d <= r.end);
            };
            for (const c of data.canali) {
              for (const a of c.accounts) {
                if (!a.url || !/\/(video|reel|reels)\/i.test(a.url)) continue;
                if (!isInRange(a.date)) continue;
                const existing = a.ocrData;
                if (!existing?.status || existing.status !== 'ok') count++;
              }
            }
            console.log(count);
          ")

          echo "Posts da elaborare: $REMAINING"

          if [ "$REMAINING" -gt 0 ]; then
            echo "🔄 Relaunching workflow - still $REMAINING posts to process"
            gh workflow run analyze-bluserena-ocr.yml \
              -f max_posts=2000 \
              -f reprocess_failed=false
          else
            echo "✅ All posts processed!"
          fi
